version: '3.8'

services:
  pocketbase:
    image: ghcr.io/pocketbase/pocketbase:latest
    container_name: orchies-pocketbase
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - ./pb_data:/pb_data
      - ./pb/pb_migrations:/pb/pb_migrations
    environment:
      - POCKETBASE_ADMIN_EMAIL=admin@orchies.click
      - POCKETBASE_ADMIN_PASSWORD=admin123
    command:
      - serve
      - http://0.0.0.0:8090
      - --dir=/pb_data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orchies-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NEXT_PUBLIC_POCKETBASE_URL=http://pocketbase:8090
    depends_on:
      - pocketbase

volumes:
  pocketbase_data:
